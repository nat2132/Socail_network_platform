<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot password · Mahber</title>
  <link rel="stylesheet" href="css/design-system.css">
</head>
<body class="auth">
  <div class="auth__bg" aria-hidden="true"></div>

  <div class="auth__wrap">
    <div class="auth__panel" style="max-width:470px;">
      <a class="btn btn--icon btn--ghost" href="sign_in.html" aria-label="Back to sign in">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m11 18-6-6 6-6"/></svg>
      </a>

      <div class="card auth__card" style="margin-top:16px;">
        <h1>Reset your password</h1>
        <p class="sub">Tell us the email you signed up with and we'll send you reset instructions.</p>

        <label class="field">
          <span class="field__label">Email</span>
          <input class="input" type="email" name="email" placeholder="you@example.com" autocomplete="off">
          <svg class="field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
        </label>

        <a class="btn btn--primary btn--block" href="sign_in.html">Send reset link</a>

        <p class="auth__foot">
          Remembered it? <a href="sign_in.html">Back to sign in</a>
        </p>
      </div>
      <p class="hint" style="text-align:center;margin-top:12px;">
        Prototype demo — this is a static page, so no email is actually sent and no account is looked up. The button returns you to sign in.
      </p>
    </div>
  </div>
</body>
</html>
